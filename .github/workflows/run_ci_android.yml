name: Android build
on:
  push:
    # Not on tags
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - '**/doc/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**/doc/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  test:
    name: Test on ${{ matrix.os }} / flutter ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    # Flutter master might fail, it does not fail the workflow
    continue-on-error: ${{ matrix.flutter == 'master' }}
    defaults:
      run:
        working-directory: ./sqflite_support
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter: stable
          - os: ubuntu-latest
            flutter: beta
          - os: ubuntu-latest
            flutter: master

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter }}
      - run: dart pub get
      - run: dart run tool/run_ci_android.dart
