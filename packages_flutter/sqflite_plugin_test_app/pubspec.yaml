name: sqflite_plugin_test_app
description: Runs sqflite_common_test on the sqflite plugin (Android, iOS, macOS), without ffi.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ">=2.4.5"
  sqflite_common_test:
    git:
      url: https://github.com/tekartik/sqflite
      path: sqflite_common_test

dev_dependencies:
  flutter_lints: ">=6.0.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  dev_build: ">=1.1.8+2"
  sqflite_support:
    path: ../../sqflite_support

dependency_overrides:
  sqflite:
    path: ../../sqflite
  sqflite_android:
    path: ../../sqflite_android
  sqflite_common:
    path: ../../sqflite_common
  sqflite_common_test:
    path: ../../sqflite_common_test
  sqflite_darwin:
    path: ../../sqflite_darwin
  sqflite_platform_interface:
    path: ../../sqflite_platform_interface

flutter:
  uses-material-design: true
